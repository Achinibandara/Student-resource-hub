```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Resource Hub | Register</title>

    <link rel="stylesheet" href="register.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            <img src="image/logo.jpeg" alt="Student Resource Hub Logo">
            <span>Student Resource Hub</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="login.html" class="login-btn">
            Login
        </a>

    </nav>


    <!-- Register Section -->
    <section class="register-section">

        <div class="register-container">

            <div class="register-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register to access Student Resource Hub
            </p>

            <form action="backend/register.php" method="POST">

                <div class="input-group">
                    <label for="name">Full Name</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text"
                               id="name"
                               name="name"
                               placeholder="Enter your full name"
                               required>
                    </div>
                </div>


                <div class="input-group">
                    <label for="email">Email</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               required>
                    </div>
                </div>


                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Create a password"
                               required>
                    </div>
                </div>


                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password"
                               id="confirm_password"
                               name="confirm_password"
                               placeholder="Confirm your password"
                               required>
                    </div>
                </div>


                <button type="submit" class="register-button">
                    <i class="fa-solid fa-user-plus"></i>
                    Register
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Resource Hub. All Rights Reserved.</p>
    </footer>

</body>
</html>
```
