<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resources | Student Resource Hub</title>

    <!-- CSS -->
    <link rel="stylesheet" href="resources.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


    <!-- ================= NAVIGATION BAR ================= -->

    <header>

        <nav class="navbar">


            <!-- Logo -->

            <div class="logo">

                <img src="image/logo.jpeg"
                     alt="Student Resource Hub Logo">

            </div>


            <!-- Navigation Menu -->

            <ul class="nav-menu">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="resources.html"
                       class="active">
                        Resources
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- Login / Register -->

            <div class="nav-buttons">

                <a href="login.html"
                   class="login-btn">
                    Login
                </a>

                <a href="register.html"
                   class="register-btn">
                    Register
                </a>

            </div>

        </nav>

    </header>



    <!-- ================= RESOURCES SECTION ================= -->

    <main class="resources-section">


        <h1>
            Study Resources
        </h1>


        <p class="intro">
            Find useful study materials and resources for your subjects.
        </p>



        <!-- ================= SEARCH ================= -->

        <div class="search-box">

            <div class="search-input">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text"
                       id="searchInput"
                       placeholder="Search resources...">

            </div>

        </div>



        <!-- ================= RESOURCE CARDS ================= -->

        <div class="resource-container"
             id="resourceContainer">

            <p class="loading">
                Loading resources...
            </p>

        </div>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>


        <div class="footer-content">

            <img src="image/location.jpeg"
                 alt="Location">

            <p>
                Rajarata University of Sri Lanka
            </p>

        </div>


        <div class="footer-content">

            <img src="image/mail.jpeg"
                 alt="Email">

            <p>
                tec.rjt.ac.lk
            </p>

        </div>


        <div class="footer-content">

            <img src="image/phone.jpeg"
                 alt="Phone">

            <p>
                025-2222335
            </p>

        </div>


    </footer>



    <!-- ================= COPYRIGHT ================= -->

    <div class="copyright">

        © 2026 Student Resource Hub.
        All rights reserved.

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= LOAD RESOURCES ================= */

        let allResources = [];


        function loadResources() {


            fetch("backend/get_resources.php")


                .then(response => {


                    if (!response.ok) {

                        throw new Error(
                            "Server error: " + response.status
                        );

                    }


                    return response.json();

                })


                .then(data => {


                    allResources = data;

                    displayResources(allResources);

                })


                .catch(error => {


                    console.error(
                        "Error loading resources:",
                        error
                    );


                    document.getElementById(
                        "resourceContainer"
                    ).innerHTML = `

                        <div class="error-message">

                            <i class="fa-solid fa-circle-exclamation"></i>

                            <p>
                                Unable to load resources.
                            </p>

                        </div>

                    `;

                });

        }



        /* ================= DISPLAY RESOURCES ================= */

        function displayResources(resources) {


            const container =
                document.getElementById(
                    "resourceContainer"
                );


            container.innerHTML = "";


            /* No resources */

            if (resources.length === 0) {


                container.innerHTML = `

                    <div class="no-resources">

                        <i class="fa-solid fa-folder-open"></i>

                        <p>
                            No resources available.
                        </p>

                    </div>

                `;


                return;

            }



            /* Create cards */

            resources.forEach(resource => {


                const card =
                    document.createElement("div");


                card.className =
                    "resource-card";


                card.innerHTML = `

                    <div class="pdf-icon">

                        <i class="fa-solid fa-file-pdf"></i>

                    </div>


                    <h2>
                        ${resource.resource_name}
                    </h2>


                    <p class="subject">

                        <strong>Subject:</strong>
                        ${resource.subject}

                    </p>


                    <p class="date">

                        <strong>Uploaded:</strong>
                        ${resource.upload_date}

                    </p>


                    <a href="resources/${resource.file_name}"
                       target="_blank"
                       class="view-button">

                        <i class="fa-solid fa-eye"></i>

                        View

                    </a>

                `;


                container.appendChild(card);

            });

        }



        /* ================= SEARCH ================= */

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            function () {


                const searchText =
                    this.value
                    .toLowerCase()
                    .trim();


                const filteredResources =
                    allResources.filter(
                        function(resource) {


                            return (

                                resource.resource_name
                                    .toLowerCase()
                                    .includes(searchText)

                                ||

                                resource.subject
                                    .toLowerCase()
                                    .includes(searchText)

                            );

                        }
                    );


                displayResources(
                    filteredResources
                );

            }
        );



        /* ================= START ================= */

        loadResources();


    </script>


</body>

</html>
